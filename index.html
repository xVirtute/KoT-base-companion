<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>King of Tokyo: Companion Suite</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0c;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-comic-heavy { font-family: 'Luckiest Guy', cursive; }
    .font-comic-clean { font-family: 'Bangers', cursive; letter-spacing: 0.05em; }

    .comic-box { border: 4px solid #000000; box-shadow: 6px 6px 0px #000000; }
    .comic-box-sm { border: 3px solid #000000; box-shadow: 3px 3px 0px #000000; }
    .comic-box-lg { border: 5px solid #000000; box-shadow: 8px 8px 0px #000000; }

    .floating-nav-dock {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    .held-style {
      border-color: #a855f7 !important;
      box-shadow: 0 0 20px 6px rgba(168, 85, 247, 0.65), 4px 4px 0px #000000 !important;
      transform: translateY(-4px);
    }

    @keyframes fastTumble {
      0% { transform: scale(1) rotate(0deg); filter: brightness(1.1); }
      50% { transform: scale(1.08) rotate(-8deg); }
      100% { transform: scale(1) rotate(8deg); }
    }
    .animate-tumble { animation: fastTumble 0.15s infinite alternate ease-in-out; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col justify-between pt-2">

  <div id="main-nav" class="hidden floating-nav-dock w-[90%] max-w-sm bg-neutral-900/90 backdrop-blur-md border-2 border-zinc-700 rounded-2xl p-1.5 flex items-center justify-between shadow-2xl">
    <div class="flex gap-1 flex-1">
      <button id="nav-score" onclick="showTab('score')" class="flex-1 py-2 bg-zinc-100 text-neutral-950 font-comic-heavy rounded-xl text-xs uppercase tracking-wider transition-all">
        Score
      </button>
      <button id="nav-dice" onclick="showTab('dice')" class="flex-1 py-2 bg-transparent font-comic-heavy rounded-xl text-xs uppercase text-zinc-400 hover:text-white tracking-wider transition-all">
        Dice
      </button>
    </div>
    <div class="w-[1px] h-6 bg-zinc-800 mx-2"></div>
    <button onclick="toggleFullscreen()" class="p-2 text-zinc-400 hover:text-white transition-all active:scale-90">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75v4.5m0-4.5h-4.5m4.5 0L15 9m5.25 11.25v-4.5m0 4.5h-4.5m4.5 0L15 15" />
      </svg>
    </button>
  </div>

  <div id="tab-setup-view" class="flex-1 p-4 overflow-y-auto max-w-md w-full mx-auto flex flex-col gap-6">
    <header class="text-center mt-4">
      <h1 class="font-comic-heavy text-4xl text-yellow-400 tracking-wider drop-shadow-[0_4px_0_#000]">TOKYO SETUP</h1>
      <p class="font-comic-clean text-lg text-zinc-400 uppercase mt-1">Assemble Your Monsters</p>
    </header>

    <section class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex flex-col gap-3 shrink-0">
      <span class="font-comic-clean text-xl text-zinc-300 uppercase tracking-wide">How many players?</span>
      <div class="grid grid-cols-5 gap-1.5">
        <button onclick="setSetupPlayerCount(2)" id="btn-count-2" class="setup-count-btn bg-zinc-800 border-2 border-zinc-700 py-2 rounded-xl font-comic-heavy text-lg text-zinc-400 transition-all">2</button>
        <button onclick="setSetupPlayerCount(3)" id="btn-count-3" class="setup-count-btn bg-zinc-800 border-2 border-zinc-700 py-2 rounded-xl font-comic-heavy text-lg text-zinc-400 transition-all">3</button>
        <button onclick="setSetupPlayerCount(4)" id="btn-count-4" class="setup-count-btn bg-zinc-800 border-2 border-zinc-700 py-2 rounded-xl font-comic-heavy text-lg text-zinc-400 transition-all">4</button>
        <button onclick="setSetupPlayerCount(5)" id="btn-count-5" class="setup-count-btn bg-zinc-800 border-2 border-zinc-700 py-2 rounded-xl font-comic-heavy text-lg text-zinc-400 transition-all">5</button>
        <button onclick="setSetupPlayerCount(6)" id="btn-count-6" class="setup-count-btn bg-zinc-800 border-2 border-zinc-700 py-2 rounded-xl font-comic-heavy text-lg text-zinc-400 transition-all">6</button>
      </div>
    </section>

    <div id="setup-players-roster" class="flex flex-col gap-3"></div>

    <button onclick="initGameFromSetup()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-neutral-950 font-comic-heavy text-2xl py-4 rounded-2xl comic-box tracking-wide transform active:translate-y-[2px] active:shadow-[2px_2px_0px_#000000] transition-all shrink-0 mb-6">
      START CRUSHING!
    </button>
  </div>

  <div id="tab-score-view" class="flex-1 p-4 pt-20 overflow-y-auto hidden">
    <div id="player-grid" class="grid grid-cols-1 gap-4 max-w-md mx-auto"></div>
  </div>

  <div id="tab-dice-view" class="flex-1 p-4 pt-20 max-w-xl mx-auto hidden flex flex-col justify-between min-h-0">
    <section class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 flex items-center justify-between gap-4 shrink-0 mb-4">
      <span class="font-comic-clean text-2xl text-zinc-400 uppercase">Dice Pool Size</span>
      <div class="flex items-center bg-black rounded-xl p-1 border-2 border-zinc-800">
        <button onclick="adjustPoolSize(-1)" class="w-10 h-10 rounded-lg bg-zinc-800 text-rose-500 font-comic-heavy text-xl flex items-center justify-center hover:bg-zinc-700 active:scale-95 transition-all">-</button>
        <span id="pool-display" class="w-12 text-center font-comic-heavy text-2xl text-yellow-400">6</span>
        <button onclick="adjustPoolSize(1)" class="w-10 h-10 rounded-lg bg-zinc-800 text-emerald-400 font-comic-heavy text-xl flex items-center justify-center hover:bg-zinc-700 active:scale-95 transition-all">+</button>
      </div>
    </section>

    <div class="flex-1 flex flex-col gap-4 min-h-0 overflow-y-auto pb-2">
      <section class="bg-zinc-900/40 border-2 border-dashed border-zinc-800 rounded-2xl p-4 flex flex-col justify-center min-h-[140px]">
        <div id="active-shelf" class="grid grid-cols-4 gap-3 justify-items-center items-center w-full m-auto p-1"></div>
      </section>
      <section class="bg-purple-950/10 border-2 border-dashed border-purple-900/40 rounded-2xl p-4 flex flex-col justify-center min-h-[140px]">
        <div id="locked-shelf" class="grid grid-cols-4 gap-3 justify-items-center items-center w-full m-auto p-1"></div>
      </section>
    </div>

    <div class="w-full mt-4 flex gap-3 shrink-0">
      <button id="roll-btn" onclick="executeManualRoll()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-comic-heavy text-2xl py-4 rounded-2xl comic-box-lg tracking-wide transform active:translate-y-[2px] active:shadow-[2px_2px_0px_#000000] transition-all">
        SMASH & ROLL!
      </button>
      <div class="bg-zinc-900 border-5 border-black rounded-2xl px-5 flex items-center justify-center font-comic-heavy text-2xl text-yellow-400 shadow-[6px_6px_0px_#000000]">
        <span>🎲</span><span id="roll-counter-display" class="ml-2">0</span>
      </div>
    </div>
  </div>

  <footer class="w-full p-2 bg-neutral-950 flex justify-center border-t border-neutral-800 shrink-0 z-50">
    <a href="https://ko-fi.com/virtute" target="_blank" class="bg-blue-600 text-white text-xs font-bold py-2 px-4 rounded-xl shadow-lg border-2 border-black flex items-center gap-2 active:scale-95 transition-all">
      ☕ Support
    </a>
  </footer>

<script src="gameEngine.js?v=2"></script>
  <script>
  try {
    setSetupPlayerCount(2);
  } catch (error) {
    alert("Found the bug! Code says: " + error.message);
  }
</script>

</body>
</html>
